<header class="app-header">
  <div class="header-container flex-between">
    <div class="logo-section flex-center">
      <div class="logo-icon"></div>
      <span class="logo-text">AI Finance<span class="text-gradient-primary">Pro</span></span>
    </div>

    <nav class="main-nav" *ngIf="authService.isLoggedIn$ | async">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Dashboard</a>
      <a routerLink="/transactions" routerLinkActive="active">Harcamalar</a>
    </nav>

    <div class="user-actions flex-center">
      <ng-container *ngIf="authService.isLoggedIn$ | async; else notLoggedIn">
        <button class="btn-outline" (click)="logout()">Çıkış Yap</button>
      </ng-container>
      <ng-template #notLoggedIn>
        <a routerLink="/login" class="btn-outline" style="margin-right: 12px; text-decoration: none;">Giriş Yap</a>
        <a routerLink="/register" class="btn-primary" style="text-decoration: none;">Kayıt Ol</a>
      </ng-template>
    </div>
  </div>
</header>

<main class="app-content">
  <!-- Dynamic content will be loaded here -->
  <router-outlet></router-outlet>
</main>
